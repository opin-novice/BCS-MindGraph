<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BCS বাতিঘর — MCQ Generator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; color: #1a1a2e; padding: 20px; }
  .container { max-width: 800px; margin: 0 auto; }
  header { text-align: center; padding: 30px 0; }
  header h1 { font-size: 2rem; color: #16213e; }
  header p { color: #555; font-size: 0.95rem; }
  .card { background: white; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .form-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
  .form-group { flex: 1; min-width: 150px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.85rem; color: #333; }
  select, input { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 0.95rem; }
  .btn { background: #0f3460; color: white; border: none; padding: 10px 28px; border-radius: 8px; font-size: 1rem; cursor: pointer; font-weight: 600; transition: background 0.2s; white-space: nowrap; }
  .btn:hover { background: #1a5276; }
  .btn:disabled { background: #999; cursor: not-allowed; }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .mcq { border-left: 4px solid #0f3460; padding: 16px; margin-bottom: 14px; background: #fafafa; border-radius: 0 8px 8px 0; }
  .mcq .question { font-size: 1.05rem; font-weight: 600; margin-bottom: 10px; }
  .mcq .options { list-style: none; }
  .mcq .options li { padding: 6px 0; font-size: 0.95rem; }
  .mcq .options .correct { color: #27ae60; font-weight: 700; }
  .mcq .options .correct::after { content: " ✓"; }
  .mcq .meta { margin-top: 10px; font-size: 0.82rem; color: #666; display: flex; gap: 16px; flex-wrap: wrap; }
  .mcq .meta .tag { background: #e8eaf6; padding: 2px 10px; border-radius: 12px; }
  .mcq .explanation { margin-top: 8px; font-size: 0.88rem; color: #444; background: #fef9e7; padding: 8px 12px; border-radius: 6px; }
  .summary { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; }
  .stat { background: white; padding: 16px 24px; border-radius: 10px; text-align: center; flex: 1; min-width: 100px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .stat .num { font-size: 1.6rem; font-weight: 700; color: #0f3460; }
  .stat .lbl { font-size: 0.78rem; color: #777; margin-top: 2px; }
  .error { background: #fdeded; color: #b71c1c; padding: 12px 16px; border-radius: 8px; margin-bottom: 14px; border-left: 4px solid #b71c1c; }
  .empty { text-align: center; color: #999; padding: 40px 0; }
  .footer { text-align: center; color: #999; font-size: 0.8rem; padding: 20px 0; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 12px 24px; border-radius: 8px; font-size: 0.9rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .feedback-section { margin-top: 12px; padding-top: 10px; border-top: 1px solid #e0e0e0; }
  .feedback-label { font-size: 0.82rem; color: #666; display: block; margin-bottom: 4px; }
  .feedback-stars { display: flex; gap: 4px; }
  .star { font-size: 1.4rem; cursor: pointer; color: #ccc; transition: color 0.15s; user-select: none; }
  .star:hover, .star.active { color: #f39c12; }
  .star.selected { color: #f39c12; }
  .btn-feedback { background: #27ae60; color: white; border: none; padding: 6px 16px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; margin-top: 6px; }
  .btn-feedback:hover { background: #219a52; }
  .btn-feedback:disabled { background: #999; cursor: not-allowed; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🏛️ BCS বাতিঘর</h1>
    <p>BCS প্রস্তুতির জন্য স্বয়ংক্রিয় MCQ জেনারেটর</p>
  </header>

  <div id="summaryStats" class="summary" style="display:none"></div>

  <div class="card">
    <form id="generateForm">
      <div class="form-row">
        <div class="form-group">
          <label for="topic">বিষয়</label>
          <select id="topic" required></select>
        </div>
        <div class="form-group">
          <label for="difficulty">কঠিনতা</label>
          <select id="difficulty">
            <option value="easy">সহজ</option>
            <option value="medium" selected>মাঝারি</option>
            <option value="hard">কঠিন</option>
          </select>
        </div>
        <div class="form-group">
          <label for="count">সংখ্যা</label>
          <select id="count">
            <option value="1">১টি</option>
            <option value="3">৩টি</option>
            <option value="5">৫টি</option>
            <option value="10">১০টি</option>
          </select>
        </div>
        <div class="form-group">
          <label for="max_facts">সর্বোচ্চ তথ্য</label>
          <select id="max_facts">
            <option value="5">৫টি</option>
            <option value="10">১০টি</option>
            <option value="20">২০টি</option>
            <option value="0">সবগুলো</option>
          </select>
        </div>
        <button type="submit" class="btn" id="generateBtn">জেনারেট করুন</button>
      </div>
    </form>
  </div>

  <div id="statusMessage"></div>
  <div id="results"></div>

  <div class="footer">Powered by Groq Llama-3.1-8B · BCS Batighor v1.0</div>
</div>

<div id="toast" class="toast"></div>

<script>
const API_BASE = '/api/v1';

async function fetchJSON(url, opts = {}) {
  const res = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opts });
  if (!res.ok) {
    const body = await res.text().catch(() => '');
    throw new Error(body ? body.slice(0, 200) : res.statusText);
  }
  return res.json();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show';
  setTimeout(() => t.className = 'toast', 3000);
}

function submitFeedback(el) {
  const container = el.closest('.mcq');
  const stars = container.querySelectorAll('.star');
  const rating = parseInt(el.dataset.rating);
  stars.forEach(s => {
    s.classList.toggle('selected', parseInt(s.dataset.rating) <= rating);
  });
  const extra = container.querySelector('.feedback-extra');
  extra.style.display = 'block';
  extra.dataset.rating = rating;
}

async function sendFeedback(el) {
  const container = el.closest('.mcq');
  const mcqId = container.dataset.mcqId;
  const episodeId = container.dataset.episodeId;
  const factIds = JSON.parse(container.dataset.factIds || '[]');
  const rating = parseInt(container.querySelector('.feedback-extra').dataset.rating || '3');
  const category = container.querySelector('.feedback-cat').value || null;
  const comment = container.querySelector('.feedback-comment').value.trim() || null;
  const msgDiv = container.querySelector('.feedback-msg');

  if (!mcqId || !episodeId) {
    msgDiv.textContent = 'MCQ ID পাওয়া যায়নি';
    return;
  }

  el.disabled = true;
  el.textContent = 'জমা হচ্ছে...';

  try {
    const res = await fetch(API_BASE + '/feedback', {
      method: 'POST',
      body: JSON.stringify({
        episode_id: episodeId,
        mcq_id: mcqId,
        fact_ids: factIds.length > 0 ? factIds : undefined,
        rating: rating,
        category: category,
        comment: comment,
      }),
      headers: { 'Content-Type': 'application/json' },
    });
    if (!res.ok) throw new Error((await res.text()).slice(0, 200));
    msgDiv.textContent = '⭐ ধন্যবাদ! আপনার মতামত রেকর্ড করা হয়েছে।';
    container.querySelector('.feedback-extra').style.display = 'none';
    container.querySelectorAll('.star').forEach(s => s.style.pointerEvents = 'none');
  } catch (e) {
    msgDiv.textContent = 'ব্যর্থ: ' + e.message;
    el.disabled = false;
    el.textContent = 'জমা দিন';
  }
}

async function loadTopics() {
  try {
    const topics = await fetchJSON(API_BASE + '/topics');
    const sel = document.getElementById('topic');
    sel.innerHTML = topics.map(t =>
      `<option value="${t.topic}">${t.topic} (${t.fact_count}টি তথ্য)</option>`
    ).join('');
  } catch (e) {
    showToast('বিষয় তালিকা লোড করতে ব্যর্থ: ' + e.message);
  }
}

document.getElementById('generateForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('generateBtn');
  const statusDiv = document.getElementById('statusMessage');
  const resultsDiv = document.getElementById('results');
  const summaryDiv = document.getElementById('summaryStats');

  const topic = document.getElementById('topic').value;
  const difficulty = document.getElementById('difficulty').value;
  const count = parseInt(document.getElementById('count').value);
  const max_facts = parseInt(document.getElementById('max_facts').value) || undefined;

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> জেনারেট হচ্ছে...';
  statusDiv.innerHTML = '';
  resultsDiv.innerHTML = '';
  summaryDiv.style.display = 'none';

  try {
    const data = await fetchJSON(API_BASE + '/generate', {
      method: 'POST',
      body: JSON.stringify({ topic, difficulty, count, max_facts }),
    });

    if (data.error) {
      statusDiv.innerHTML = `<div class="error">${data.error}</div>`;
      return;
    }

    if (data.mcqs.length === 0) {
      resultsDiv.innerHTML = '<div class="empty">কোনো MCQ জেনারেট করা যায়নি</div>';
      return;
    }

    summaryDiv.style.display = 'flex';
    summaryDiv.innerHTML = `
      <div class="stat"><div class="num">${data.count}</div><div class="lbl">MCQ</div></div>
      <div class="stat"><div class="num">${data.topic}</div><div class="lbl">বিষয়</div></div>
      <div class="stat"><div class="num">${difficulty === 'easy' ? 'সহজ' : difficulty === 'medium' ? 'মাঝারি' : 'কঠিন'}</div><div class="lbl">কঠিনতা</div></div>
      <div class="stat"><div class="num">${data.kg_size || '-'}</div><div class="lbl">KG নোড</div></div>
    `;

    resultsDiv.innerHTML = data.mcqs.map((m, i) => {
      const correctKey = m.correct_answer.split(')')[0].trim();
      return `<div class="mcq" data-mcq-id="${m.mcq_id || ''}" data-episode-id="${m.episode_id || ''}" data-fact-ids='${JSON.stringify(m.fact_ids || [])}'>
        <div class="question">${i+1}. ${m.question}</div>
        <ul class="options">${m.options.map(o =>
          `<li${o.key === correctKey ? ' class="correct"' : ''}>${o.key}) ${o.text}</li>`
        ).join('')}</ul>
        <div class="meta">
          <span class="tag">${m.difficulty}</span>
          <span>স্কোর: ${(m.quality_score * 100).toFixed(0)}%</span>
        </div>
        ${m.explanation ? `<div class="explanation">${m.explanation}</div>` : ''}
        <div class="feedback-section">
          <span class="feedback-label">এই MCQ টি কেমন লাগলো?</span>
          <div class="feedback-stars">
            ${[1,2,3,4,5].map(s => `<span class="star" data-rating="${s}" onclick="submitFeedback(this)">★</span>`).join('')}
          </div>
          <div class="feedback-extra" style="display:none;margin-top:8px;">
            <select class="feedback-cat">
              <option value="">বিভাগ নির্বাচন করুন</option>
              <option value="correct_clear">সঠিক ও পরিষ্কার</option>
              <option value="unclear_stem">প্রশ্ন অস্পষ্ট</option>
              <option value="wrong_answer">উত্তর ভুল</option>
              <option value="bad_distractors">বিকল্পগুলো দুর্বল</option>
              <option value="too_easy">অতিরিক্ত সহজ</option>
              <option value="too_hard">অতিরিক্ত কঠিন</option>
            </select>
            <textarea class="feedback-comment" rows="2" placeholder="মন্তব্য..." style="width:100%;margin-top:6px;padding:6px;border:1px solid #ddd;border-radius:6px;font-size:0.85rem;"></textarea>
            <button class="btn-feedback" onclick="sendFeedback(this)">জমা দিন</button>
          </div>
          <div class="feedback-msg" style="margin-top:4px;font-size:0.8rem;color:#27ae60;"></div>
        </div>
      </div>`;
    }).join('');

    showToast(`${data.count}টি MCQ তৈরি হয়েছে!`);
  } catch (e) {
    statusDiv.innerHTML = `<div class="error">${e.message}</div>`;
  } finally {
    btn.disabled = false;
    btn.innerHTML = 'জেনারেট করুন';
  }
});

loadTopics();
</script>
</body>
</html>
