web:
  search_api: "duckduckgo"
  timeout_seconds: 10
  enabled: true
  min_facts_for_topic: 5
  max_sentences_to_score: 20
  quality_threshold: 0.50

kg:
  storage: "networkx"
  data_dir: "data"

mcq_gen:
  model: "llama-3.1-8b-instant"
  batch_size: 10
  min_pass_score: 0.70
  max_regeneration_rounds: 3

quality:
  pass_threshold: 0.70
  grounding_minimum: 0.80

memory:
  db_path: "runtime/memory.db"
  decay_lambda: 0.05
